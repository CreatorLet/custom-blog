services:
  - type: web
    name: custom-blog
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_OWNER
        value: CreatorLet
      - key: GITHUB_REPO
        value: custom-blog
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
